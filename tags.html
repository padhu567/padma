<head>

</head>
<body>
<style>
h1{
   color:purple;}
 .div-class{

}
.div-tag{
    color:red;
}
#heading-education
{
  color:brown;
}
.class-special
{
  color:violet;
}
</style>

</div>
<h1 id="heading-education"class="class-special">HELLO ADINARAYANA</h1>

<p class="para-class">dheeraj</p>

</div>
</body>
</html>
